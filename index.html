<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="icon.png">
</head>
<body>
    <div class="header" id="warning">Please Sign In and Out at the Front Desk!</div>
    
    <div class="header" id="help">Need Help? Just Raise Your Hand!</div>

    <div id="live-sessions-container"></div>

    <div class="grid-container" id="onDutyGrid"></div>

    <div class="spacer"></div>
    
    <div class="header">Off-Duty Tutors</div>

    <div class="grid-container" id="offDutyGrid"></div>    

    <div class="background-selector">
        <label for="backgroundSelect" style="font-weight: bold; font-size: 1.5em;">Choose Background:</label>
        <select id="backgroundSelect">
            <option value="backgrounds/spring.jpg">Spring</option>            
            <option value="backgrounds/summer.jpg">Summer</option>
            <option value="backgrounds/fall.jpg" selected>Fall</option>
            <option value="backgrounds/winter.jpg">Winter</option>
        </select>
    </div>

    <script src="script.js"></script>
</body>
</html>
