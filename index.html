<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="icon.png">
</head>
<body>
    <h1 class="warning">Please Make Sure To Sign In And Out At The Front Of The Room!</h1>
    
    <h1>These Tutors Are Here To Help — Just Raise Your Hand!</h1>

    <div class="grid-container" id="onDutyGrid"></div>
        
    <div class="spacer"></div>
    
    <h1>Off-Duty Tutors</h1>
    
    <div class="grid-container" id="offDutyGrid"></div>    

    <div class="background-selector">
        <label for="backgroundSelect" style="font-weight: bold; font-size: 1.5em;">Choose Background:</label>
        <select id="backgroundSelect">
            <option value="backgrounds/spring.jpg">Spring</option>            
            <option value="backgrounds/summer.jpg" selected>Summer</option>
            <option value="backgrounds/fall.jpg">Fall</option>
            <option value="backgrounds/winter.jpg">Winter</option>
        </select>
    </div>

    <script src="script.js"></script>
</body>
</html>
